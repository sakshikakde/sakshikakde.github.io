<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spectral Mesh Visualizer — Suzanne Monkey</title>
  <style>
    :root {
      --bg: #1a1814;
      --surface: #242018;
      --border: #3a342a;
      --text: #f0ebe0;
      --muted: #8a7f6f;
      --accent: #d4500a;
      --yellow: #f5c842;
      --yellow-dim: rgba(245,200,66,0.15);
      --green: #3ecf7a;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 14px 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--text); }
    .back-btn svg { width: 14px; height: 14px; }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      background: var(--yellow-dim);
      border: 1px solid var(--yellow);
      color: var(--yellow);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
    }

    /* ── Canvas area ── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Overlay stats ── */
    .overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(26,24,20,0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .k-display {
      font-size: 28px;
      font-weight: 800;
      color: var(--yellow);
      line-height: 1;
    }
    .k-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }
    .k-pct {
      font-size: 12px;
      color: var(--green);
      margin-top: 6px;
      font-weight: 600;
    }

    /* ── Controls overlay (top right) ── */
    .controls-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctrl-btn {
      background: rgba(26,24,20,0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover { border-color: var(--yellow); color: var(--yellow); }
    .ctrl-btn.active { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-dim); }

    /* ── Loading screen ── */
    #loading {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }
    #loading-bar-wrap {
      width: 220px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      background: var(--yellow);
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s;
    }

    /* ── Bottom slider panel ── */
    .panel {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 28px 20px;
    }

    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .play-btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .play-btn:hover { opacity: 0.85; }

    /* Ticks */
    .ticks-wrap {
      position: relative;
      padding-bottom: 20px;
      margin-bottom: 6px;
    }

    .slider-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }
    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--yellow);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--yellow);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .slider-input::-webkit-slider-thumb:active { transform: scale(1.2); }
    .slider-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--yellow);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--yellow);
      cursor: pointer;
    }

    .tick-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    .tick-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s;
      user-select: none;
    }
    .tick-label:hover { color: var(--text); }
    .tick-label.active { color: var(--yellow); }

    .hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <div class="title">Spectral Mesh Visualizer</div>
      <div class="subtitle">Suzanne Monkey — Low-pass filtered via Laplacian eigenfunctions</div>
    </div>
  </div>
  <div class="badge">Interactive</div>
</div>

<div id="canvas-wrap">
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Loading meshes…</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  </div>

  <!-- overlays shown after load -->
  <div class="overlay" id="stats-overlay" style="display:none">
    <div class="k-display" id="k-val">10</div>
    <div class="k-label">Eigenfunctions (K)</div>
    <div class="k-pct" id="k-pct">2% of 507 vertices</div>
  </div>

  <div class="controls-overlay" id="ctrl-overlay" style="display:none">
    <button class="ctrl-btn" id="btn-wire">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/>
      </svg>
      Wireframe
    </button>
    <button class="ctrl-btn active" id="btn-rotate">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M13 8A5 5 0 1 1 8 3"/><polyline points="13 3 13 8 8 8"/>
      </svg>
      Auto-rotate
    </button>
  </div>
</div>

<div class="panel" id="panel" style="display:none">
  <div class="panel-top">
    <div class="panel-title">Number of eigenfunctions (K)</div>
    <button class="play-btn" id="play-btn">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><polygon points="3,2 13,8 3,14"/></svg>
      Animate
    </button>
  </div>

  <input type="range" class="slider-input" id="k-slider" min="0" max="9" step="1" value="0"/>

  <div class="tick-labels" id="tick-labels"></div>
  <div class="hint">Drag slider · click labels · orbit with mouse · scroll to zoom</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const K_VALUES = [10, 20, 30, 40, 50, 100, 200, 300, 400, 500];
const TOTAL_VERTS = 507;

// ── Scene setup ──────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1814);
scene.fog = new THREE.FogExp2(0x1a1814, 0.06);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.position.set(0, 0.3, 3.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

// ── Lighting ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff8e8, 0.6));

const keyLight = new THREE.DirectionalLight(0xfff3cc, 2.2);
keyLight.position.set(3, 5, 4);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xd4500a, 0.5);
fillLight.position.set(-4, 2, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x4a8fff, 0.8);
rimLight.position.set(0, -3, -5);
scene.add(rimLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.ShadowMaterial({ opacity: 0.25 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.0;
ground.receiveShadow = true;
scene.add(ground);

// ── Materials ─────────────────────────────────────────────────
const meshMaterial = new THREE.MeshStandardMaterial({
  color: 0xe8d0a0, roughness: 0.55, metalness: 0.08, side: THREE.DoubleSide,
});
const wireMaterial = new THREE.MeshBasicMaterial({
  color: 0xf5c842, wireframe: true, opacity: 0.25, transparent: true,
});

// ── Build geometries from embedded data ───────────────────────
function buildGeometry(k) {
  const data = MESH_DATA[String(k)];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(data.v, 3));
  geo.setIndex(data.f);
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  const center = new THREE.Vector3();
  geo.boundingBox.getCenter(center);
  geo.translate(-center.x, -center.y, -center.z);
  return geo;
}

const geometries = K_VALUES.map(buildGeometry);

// ── State ─────────────────────────────────────────────────────
let currentMeshObj = null;
let wireOverlay = null;
let isWireframe = false;
let autoRotate = true;
let currentIndex = 0;
let playing = false;
let playTimer = null;
let currentY = 0;

function showMesh(index) {
  currentIndex = index;
  if (currentMeshObj) { currentY = currentMeshObj.rotation.y; scene.remove(currentMeshObj); }
  if (wireOverlay) scene.remove(wireOverlay);

  const geo = geometries[index];
  const mesh = new THREE.Mesh(geo, meshMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.rotation.y = currentY;
  scene.add(mesh);
  currentMeshObj = mesh;

  const wMesh = new THREE.Mesh(geo, wireMaterial);
  wMesh.visible = isWireframe;
  wMesh.rotation.y = currentY;
  scene.add(wMesh);
  wireOverlay = wMesh;

  const k = K_VALUES[index];
  document.getElementById('k-val').textContent = k;
  document.getElementById('k-pct').textContent =
    Math.round((k / TOTAL_VERTS) * 100) + '% of ' + TOTAL_VERTS + ' vertices';
  document.getElementById('k-slider').value = index;
  document.querySelectorAll('.tick-label').forEach((el, i) =>
    el.classList.toggle('active', i === index));
}

// ── Show UI immediately (no loading needed) ────────────────────
document.getElementById('loading').style.display = 'none';
document.getElementById('stats-overlay').style.display = '';
document.getElementById('ctrl-overlay').style.display = '';
document.getElementById('panel').style.display = '';
showMesh(0);

// ── Tick labels ───────────────────────────────────────────────
const tickWrap = document.getElementById('tick-labels');
K_VALUES.forEach((k, i) => {
  const el = document.createElement('div');
  el.className = 'tick-label';
  el.textContent = k;
  el.addEventListener('click', () => { stopPlay(); showMesh(i); });
  tickWrap.appendChild(el);
});

// ── Slider ────────────────────────────────────────────────────
document.getElementById('k-slider').addEventListener('input', (e) => {
  stopPlay();
  showMesh(parseInt(e.target.value));
});

// ── Wireframe ─────────────────────────────────────────────────
document.getElementById('btn-wire').addEventListener('click', function () {
  isWireframe = !isWireframe;
  this.classList.toggle('active', isWireframe);
  if (wireOverlay) wireOverlay.visible = isWireframe;
});

// ── Auto-rotate ───────────────────────────────────────────────
document.getElementById('btn-rotate').addEventListener('click', function () {
  autoRotate = !autoRotate;
  this.classList.toggle('active', autoRotate);
});

// ── Play ──────────────────────────────────────────────────────
function stopPlay() {
  playing = false;
  clearInterval(playTimer);
  document.getElementById('play-btn').innerHTML =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><polygon points="3,2 13,8 3,14"/></svg> Animate';
}

document.getElementById('play-btn').addEventListener('click', function () {
  if (playing) { stopPlay(); return; }
  playing = true;
  this.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg> Pause';
  let idx = 0;
  showMesh(idx);
  playTimer = setInterval(() => {
    idx = (idx + 1) % K_VALUES.length;
    showMesh(idx);
    if (idx === K_VALUES.length - 1) setTimeout(stopPlay, 800);
  }, 900);
});

// ── Resize ────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ───────────────────────────────────────────────
let lastTime = 0;
function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  if (autoRotate && currentMeshObj) {
    currentMeshObj.rotation.y += 0.25 * dt;
    if (wireOverlay) wireOverlay.rotation.y = currentMeshObj.rotation.y;
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
